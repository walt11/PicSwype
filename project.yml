name: PicSwype
options:
  bundleIdPrefix: com.walt
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    DEVELOPMENT_TEAM: 76BJCJ4Q7X
    SWIFT_VERSION: '5.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  PicSwype:
    type: application
    platform: iOS
    sources:
      - path: PicSwype
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    info:
      path: PicSwype/Info.plist
      properties:
        NSHumanReadableCopyright: Copyright © 2026 John Walter
        CFBundleDisplayName: PicSwype
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: PicSwype shows your photos and videos, finds matching copies in linked libraries, and deletes the copies you select in the deletion queue.
        NSLocalNetworkUsageDescription: PicSwype connects to your Immich or Synology Photos server to show photos and delete the copies you select.
    settings:
      base:
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: 11
        PRODUCT_BUNDLE_IDENTIFIER: com.walt.PicSwype
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
  PicSwypeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PicSwypeTests]
    dependencies:
      - target: PicSwype
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
